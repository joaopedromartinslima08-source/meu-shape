const FOODS=FOOD_DATA.map((x,i)=>({id:'base-'+i,name:x[0],kcal:x[1],p:x[2],c:x[3],f:x[4],unit:/\(100 ml\)|\(ml\)/i.test(x[0])?'ml':'g'}));
const KEY='meushape_v2';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){};if(!db||typeof db!=='object'){let legacy;try{legacy=JSON.parse(localStorage.getItem('meushape_v1'))}catch(e){};db={goals:legacy?.goals||{kcal:2300,p:155,c:262,f:70},entries:(legacy?.entries||[]).map(e=>({...e,meal:e.meal||'Lanche'})),custom:legacy?.custom||[]}};
db.goals=db.goals||{kcal:2300,p:155,c:262,f:70};db.entries=Array.isArray(db.entries)?db.entries:[];db.custom=Array.isArray(db.custom)?db.custom:[];db.favorites=Array.isArray(db.favorites)?db.favorites:[];db.recent=Array.isArray(db.recent)?db.recent:[];
const MEALS=['Café da manhã','Almoço','Lanche','Jantar','Ceia'];const $=id=>document.getElementById(id);const fmt=(n,d=1)=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:d});const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Armazenamento cheio ou bloqueado. Exporte um backup.')}};const allFoods=()=>[...db.custom,...FOODS];const sum=arr=>arr.reduce((a,x)=>{for(let k of ['kcal','p','c','f'])a[k]+=Number(x[k])||0;return a},{kcal:0,p:0,c:0,f:0});const dayEntries=()=>db.entries.filter(x=>x.date===state.date);const byMeal=m=>dayEntries().filter(x=>x.meal===m);const totals=()=>sum(dayEntries());const pct=(v,g)=>Math.min(100,Math.max(0,(v/(g||1))*100));const bar=(v,g)=>`<div class="track"><div class="fill" style="width:${pct(v,g)}%"></div></div>`;const uid=()=>String(Date.now())+Math.random().toString(36).slice(2);const state={page:'home',date:today(),meal:'Almoço',search:'',filter:'popular',selected:null,editId:null};const view=()=>document.getElementById('view');const show=(p)=>{state.page=p;render();window.scrollTo(0,0)};
function nav(){let hide=['search','meal','add','foodform'].includes(state.page);$('nav').classList.toggle('hidden',hide);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}
function head(title,back){return `<div class="top"><div class="rowflex"><button class="back" data-action="back" aria-label="Voltar">‹</button><h1>${esc(title)}</h1></div></div>`}
function macroLine(label,v,g){return `<div class="macro"><div class="macrohead"><span>${label}</span><span><b>${fmt(v)}g</b><em> / ${fmt(g)}g</em></span></div>${bar(v,g)}</div>`}
function home(){let t=totals(),remain=Math.round(db.goals.kcal-t.kcal);let angle=Math.round(pct(t.kcal,db.goals.kcal)*3.6);return `<div class="top"><h1>Hoje</h1><div class="actions"><button class="iconbtn" data-action="history" aria-label="Histórico">▤</button><button class="iconbtn" data-action="settings" aria-label="Configurações">⚙</button></div></div><div class="datebar"><button class="chip" data-action="prev">‹</button><input class="input" type="date" id="day" value="${state.date}"><button class="chip" data-action="next">›</button></div><div class="card summary"><div class="ring" style="--progress:${angle}deg"><div class="ringtext"><b>${fmt(Math.abs(remain),0)}</b><span>${remain>=0?'restantes':'acima da meta'}</span></div></div><div>${macroLine('Proteína',t.p,db.goals.p)}${macroLine('Carboidrato',t.c,db.goals.c)}${macroLine('Gordura',t.f,db.goals.f)}</div></div><div class="card"><div class="rowflex"><div><span class="muted small">Consumidas</span><div class="statnumber">${fmt(t.kcal,0)} <span class="muted small">kcal</span></div></div><div style="text-align:right"><span class="muted small">Meta diária</span><div class="statnumber">${fmt(db.goals.kcal,0)} <span class="muted small">kcal</span></div></div></div>${bar(t.kcal,db.goals.kcal)}</div><div class="sectiontitle">Refeições</div>${MEALS.map(m=>{let x=sum(byMeal(m));return `<div class="card meal"><div class="mealhead"><strong>${m}</strong><button data-action="openmeal" data-meal="${esc(m)}" aria-label="Editar ${esc(m)}">✎</button></div><div class="mealstats">${fmt(x.kcal,0)} kcal</div><div class="mealstats"><span>P: ${fmt(x.p)}g</span><span>C: ${fmt(x.c)}g</span><span>G: ${fmt(x.f)}g</span></div>${bar(x.kcal,db.goals.kcal)}</div>`}).join('')}<div class="footerhint">Valores alimentares de referência são aproximados por 100 g ou 100 ml. Confira marcas, modo de preparo e óleo utilizado. Sua meta é um ponto de partida, não um limite médico.</div>`}
function meal(){let arr=byMeal(state.meal);return head(state.meal)+`${arr.length?arr.map(x=>{let energy=[x.c*4,x.p*4,x.f*9],tot=energy.reduce((a,b)=>a+b,0)||1;return `<div class="item"><div class="itemhead"><div><b>${esc(x.name)}</b> <span class="muted">— ${fmt(x.grams)}${esc(x.unit||'g')}</span></div><button class="dots" data-action="entrymenu" data-id="${esc(x.id)}" aria-label="Opções">⋮</button></div><div class="itembody"><div class="miniring" style="background:conic-gradient(var(--yellow) 0 ${energy[0]/tot*360}deg,var(--green) ${energy[0]/tot*360}deg ${(energy[0]+energy[1])/tot*360}deg,#48505a ${(energy[0]+energy[1])/tot*360}deg 360deg)"><span><b>${fmt(x.kcal,0)}</b><br>kcal</span></div><div class="macrogrid"><div><span style="color:#7de9a9">${fmt(energy[0]/tot*100,0)}%</span><strong>${fmt(x.c)}g</strong><small>Carb</small><div class="dash"></div></div><div><span style="color:#7de9a9">${fmt(energy[1]/tot*100,0)}%</span><strong>${fmt(x.p)}g</strong><small>Proteína</small><div class="dash green"></div></div><div><span style="color:#7de9a9">${fmt(energy[2]/tot*100,0)}%</span><strong>${fmt(x.f)}g</strong><small>Gordura</small><div class="dash grey"></div></div></div></div></div>`}).join(''):'<div class="empty">Nenhum alimento registrado nesta refeição.</div>'}<button class="primary" data-action="search">+ Adicionar alimento</button>`}
function listFoods(){let s=state.search.trim().toLocaleLowerCase('pt-BR');let a=allFoods();if(s){let norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let q=norm(s);a=a.filter(f=>norm(f.name).includes(q))}else if(state.filter==='recent'){a=db.recent.map(id=>a.find(f=>f.id===id)).filter(Boolean)}else if(state.filter==='added'){a=db.custom}else{let popular=['Arroz branco cozido','Pão francês','Feijão carioca cozido','Ovo mexido sem óleo','Queijo muçarela','Café coado sem açúcar (100 ml)','Banana prata','Peito de frango grelhado','Macarrão cozido sem molho','Leite integral (100 ml)','Batata-doce cozida','Aveia em flocos'];a=popular.map(n=>a.find(f=>f.name===n)).filter(Boolean)}return a.slice(0,100).map(f=>`<div class="foodrow"><div style="min-width:0;flex:1"><div class="foodname">${esc(f.name)}</div><div class="sub">100${f.unit||'g'} · P ${fmt(f.p)}g · C ${fmt(f.c)}g · G ${fmt(f.f)}g</div></div><div class="right">${fmt(f.kcal,0)} kcal</div><button class="roundadd" data-action="selectfood" data-id="${esc(f.id)}" aria-label="Adicionar ${esc(f.name)}">+</button></div>`).join('')||'<div class="empty">Nenhum alimento encontrado. Use + para cadastrar um alimento do rótulo.</div>'}
function search(){return head(state.meal)+`<div class="searchrow"><input class="input" id="search" type="search" placeholder="⌕  Buscar alimento" value="${esc(state.search)}" autocomplete="off"><button data-action="newfood" aria-label="Cadastrar alimento">＋</button></div><div class="segments">${[['popular','Populares'],['recent','Recentes'],['added','Adicionados']].map(([id,n])=>`<button data-action="filter" data-filter="${id}" class="${state.filter===id?'active':''}">${n}</button>`).join('')}</div><div class="rowflex"><span class="hint">${FOODS.length} alimentos de referência + seus cadastros</span><span class="hint">Por 100 g/ml</span></div><div id="foodlist" style="margin-top:12px">${listFoods()}</div>`}
function add(){let f=allFoods().find(x=>x.id===state.selected);if(!f)return search();let g=Number(state.amount||100);let scaled=k=>f[k]*g/100;return head('Adicionar alimento')+`<div class="card"><h2 style="margin:0">${esc(f.name)}</h2><p class="hint">Referência: 100 ${f.unit||'g'} · ${fmt(f.kcal,0)} kcal. Para produtos industrializados, prefira cadastrar os valores do rótulo.</p><label class="fieldlabel">Quantidade (${f.unit||'g'})</label><input class="input" id="amount" type="number" min="0.1" max="20000" step="0.1" value="${g}"><div class="chips">${[20,50,100,150,200,250].map(n=>`<button class="chip" data-action="amount" data-amount="${n}">${n}${f.unit||'g'}</button>`).join('')}</div><div class="preview" id="foodpreview">${fmt(scaled('kcal'),0)} kcal · P ${fmt(scaled('p'))}g · C ${fmt(scaled('c'))}g · G ${fmt(scaled('f'))}g</div><label class="fieldlabel">Refeição</label><select id="mealSelect">${MEALS.map(m=>`<option ${m===state.meal?'selected':''}>${m}</option>`).join('')}</select><button class="primary" data-action="saveentry">Adicionar à refeição</button></div>`}
function settings(){return `<div class="top"><h1>Configurações</h1></div><div class="card"><h2>Minhas metas diárias</h2><div class="formgrid">${[['kcal','Calorias (kcal)'],['p','Proteína (g)'],['c','Carboidrato (g)'],['f','Gordura (g)']].map(([k,label])=>`<div><label class="fieldlabel">${label}</label><input class="input" id="goal_${k}" type="number" min="0" step="0.1" value="${db.goals[k]}"></div>`).join('')}</div><button class="primary" data-action="savegoals">Salvar metas</button><p class="hint">As metas de macros podem não somar exatamente as calorias devido a arredondamentos.</p></div><div class="card"><h2>Seus dados</h2><p class="hint">Os registros ficam salvos neste navegador e podem ser perdidos se você limpar os dados do site ou trocar de aparelho.</p><button class="secondary wide" data-action="export">↓ Exportar backup JSON</button><label class="fieldlabel">Importar backup</label><input type="file" id="importfile" accept=".json,application/json" class="input"><p class="hint">A importação substitui os registros atuais. Exporte antes.</p><button class="secondary wide" data-action="clear" style="margin-top:12px">Apagar meus registros</button></div><div class="card"><h2>Banco de alimentos</h2><p class="hint">${FOODS.length} referências alimentares aproximadas, além dos seus alimentos personalizados. Pesos são da porção comestível. Alimento cru e cozido não são equivalentes; gordura de preparo deve ser registrada separadamente.</p><button class="secondary wide" data-action="newfood">+ Cadastrar alimento do rótulo</button></div>`}
function foodform(){return head('Meu alimento')+`<div class="card"><p class="hint">Cadastre por 100 g ou 100 ml. Copie os valores do rótulo e converta para 100 g/ml quando necessário.</p><label class="fieldlabel">Nome do alimento / marca</label><input class="input" id="fname" maxlength="120" placeholder="Ex.: Iogurte marca X"><label class="fieldlabel">Unidade</label><select id="funit"><option value="g">gramas (g)</option><option value="ml">mililitros (ml)</option></select><div class="formgrid">${[['kcal','Calorias (kcal)'],['p','Proteínas (g)'],['c','Carboidratos (g)'],['f','Gorduras (g)']].map(([k,n])=>`<div><label class="fieldlabel">${n}</label><input class="input" type="number" min="0" max="1000" step="0.01" id="f_${k}" value="0"></div>`).join('')}</div><button class="primary" data-action="savefood">Salvar alimento</button></div><p class="hint">Para mais precisão, registre óleo, molhos e acompanhamentos. Os valores variam entre marcas e receitas.</p>`}
function macros(){let t=totals();return `<div class="top"><h1>Macros</h1></div><div class="card"><h2 style="margin-top:0">Resumo de ${esc(state.date.split('-').reverse().join('/'))}</h2><div class="statnumber">${fmt(t.kcal,0)} <span class="muted small">/ ${fmt(db.goals.kcal,0)} kcal</span></div>${bar(t.kcal,db.goals.kcal)}<div style="margin-top:20px">${macroLine('Proteína',t.p,db.goals.p)}${macroLine('Carboidrato',t.c,db.goals.c)}${macroLine('Gordura',t.f,db.goals.f)}</div></div><div class="sectiontitle">Distribuição por refeição</div>${MEALS.map(m=>{let a=sum(byMeal(m));return `<div class="card"><div class="rowflex"><b>${m}</b><b>${fmt(a.kcal,0)} kcal</b></div><div class="mealstats">P: ${fmt(a.p)}g &nbsp; C: ${fmt(a.c)}g &nbsp; G: ${fmt(a.f)}g</div>${bar(a.kcal,db.goals.kcal)}</div>`}).join('')}<p class="hint">Calorias informadas nas tabelas podem diferir de 4 × proteína + 4 × carboidrato + 9 × gordura, por fibras, arredondamentos e metodologias de rotulagem.</p>`}
function history(){let dates=[...new Set(db.entries.map(x=>x.date))].sort().reverse();return `<div class="top"><h1>Histórico</h1></div><div class="card"><h2 style="margin-top:0">Dias registrados</h2>${dates.length?dates.map(d=>{let t=sum(db.entries.filter(x=>x.date===d));return `<div class="historyrow"><button class="textbtn" data-action="gotodate" data-date="${d}">${d.split('-').reverse().join('/')}</button><span>${fmt(t.kcal,0)} kcal <span class="muted small">· ${fmt(t.p)}g proteína</span></span></div>`}).join(''):'<div class="empty">Registre suas refeições para visualizar o histórico.</div>'}</div><p class="hint">Para preservar seu histórico, exporte um backup regularmente em Configurações.</p>`}
function render(){nav();view().innerHTML=({home,meal,search,add,settings,foodform,macros,history}[state.page]||home)();}
function updatePreview(){let f=allFoods().find(x=>x.id===state.selected);let g=Number($('amount')?.value);if(f&&$('foodpreview'))$('foodpreview').textContent=`${fmt(f.kcal*g/100,0)} kcal · P ${fmt(f.p*g/100)}g · C ${fmt(f.c*g/100)}g · G ${fmt(f.f*g/100)}g`}
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;$('foodlist').innerHTML=listFoods()}if(e.target.id==='amount'){state.amount=e.target.value;updatePreview()}if(e.target.id==='day'){state.date=e.target.value||today();render()}});
document.addEventListener('change',async e=>{if(e.target.id==='importfile'){let file=e.target.files[0];if(!file)return;try{let o=JSON.parse(await file.text());if(!Array.isArray(o.entries)||!Array.isArray(o.custom)||!o.goals)throw Error('Arquivo inválido');if(!confirm('Substituir todos os dados atuais pelos do backup?'))return;db={goals:o.goals,entries:o.entries,custom:o.custom,favorites:o.favorites||[],recent:o.recent||[]};save();show('home');alert('Backup importado.')}catch(err){alert('Não foi possível importar: '+err.message)}}});
document.addEventListener('click',e=>{let navbtn=e.target.closest('[data-page]');if(navbtn){show(navbtn.dataset.page);return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='back'){show(state.page==='search'?'meal':state.page==='add'?'search':'home')}if(a==='history'||a==='settings')show(a);if(a==='prev'||a==='next'){let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+(a==='prev'?-1:1));state.date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');render()}if(a==='openmeal'){state.meal=b.dataset.meal;show('meal')}if(a==='search'){state.search='';state.filter='popular';show('search')}if(a==='filter'){state.filter=b.dataset.filter;render();$('search')?.focus()}if(a==='selectfood'){state.selected=b.dataset.id;state.amount=100;show('add')}if(a==='amount'){state.amount=Number(b.dataset.amount);$('amount').value=state.amount;updatePreview()}if(a==='saveentry'){let f=allFoods().find(x=>x.id===state.selected);let grams=Number($('amount')?.value);if(!f||!Number.isFinite(grams)||grams<=0||grams>20000){alert('Informe uma quantidade válida.');return}let meal=$('mealSelect').value;db.entries.push({id:uid(),date:state.date,meal,name:f.name,grams,unit:f.unit||'g',kcal:f.kcal*grams/100,p:f.p*grams/100,c:f.c*grams/100,f:f.f*grams/100});db.recent=[f.id,...db.recent.filter(id=>id!==f.id)].slice(0,30);save();state.meal=meal;show('meal')}if(a==='entrymenu'){let x=db.entries.find(x=>x.id===b.dataset.id);if(!x)return;let choice=prompt('Digite 1 para alterar a quantidade, 2 para excluir:', '1');if(choice==='1'){let g=Number(prompt('Nova quantidade ('+(x.unit||'g')+'):',x.grams));if(Number.isFinite(g)&&g>0&&g<=20000){let ratio=g/x.grams;for(let k of ['kcal','p','c','f'])x[k]*=ratio;x.grams=g;save();render()}}else if(choice==='2'&&confirm('Excluir '+x.name+'?')){db.entries=db.entries.filter(y=>y.id!==x.id);save();render()}}if(a==='savegoals'){let o={};for(let k of ['kcal','p','c','f']){o[k]=Number($('goal_'+k).value);if(!Number.isFinite(o[k])||o[k]<0||o[k]>10000){alert('Verifique as metas.');return}}db.goals=o;save();alert('Metas salvas!');render()}if(a==='newfood')show('foodform');if(a==='savefood'){let name=$('fname').value.trim();if(!name){alert('Informe o nome.');return}let o={id:'custom-'+uid(),name,unit:$('funit').value};for(let k of ['kcal','p','c','f']){o[k]=Number($('f_'+k).value);if(!Number.isFinite(o[k])||o[k]<0||o[k]>1000){alert('Valor inválido: '+k);return}}db.custom.unshift(o);save();state.search=name;state.filter='added';show('search')}if(a==='gotodate'){state.date=b.dataset.date;show('home')}if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download='meu-shape-backup-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}if(a==='clear'&&confirm('Apagar todos os registros, metas e alimentos cadastrados?')&&confirm('Confirma? Não será possível desfazer sem backup.')){db={goals:{kcal:2300,p:155,c:262,f:70},entries:[],custom:[],recent:[],favorites:[]};save();show('home')}});
save();render();
</script></body></html>
