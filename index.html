function head(title,back){return `<div class="top"><div class="rowflex"><button class="back" data-action="back" aria-label="Voltar">‹</button><h1>${esc(title)}</h1></div></div>`}
function macroLine(label,v,g){return `<div class="macro"><div class="macrohead"><span>${label}</span><span><b>${fmt(v)}g</b><em> / ${fmt(g)}g</em></span></div>${bar(v,g)}</div>`}
function home(){let t=totals(),remain=Math.round(db.goals.kcal-t.kcal);let angle=Math.round(pct(t.kcal,db.goals.kcal)*3.6);return `<div class="top"><h1>Hoje</h1><div class="actions"><button class="iconbtn" data-action="history" aria-label="Histórico">▤</button><button class="iconbtn" data-action="settings" aria-label="Configurações">⚙</button></div></div><div class="datebar"><button class="chip" data-action="prev">‹</button><input class="input" type="date" id="day" value="${state.date}"><button class="chip" data-action="next">›</button></div><div class="card summary"><div class="ring" style="--progress:${angle}deg"><div class="ringtext"><b>${fmt(Math.abs(remain),0)}</b><span>${remain>=0?'restantes':'acima da meta'}</span></div></div><div>${macroLine('Proteína',t.p,db.goals.p)}${macroLine('Carboidrato',t.c,db.goals.c)}${macroLine('Gordura',t.f,db.goals.f)}</div></div><div class="card"><div class="rowflex"><div><span class="muted small">Consumidas</span><div class="statnumber">${fmt(t.kcal,0)} <span class="muted small">kcal</span></div></div><div style="text-align:right"><span class="muted small">Meta diária</span><div class="statnumber">${fmt(db.goals.kcal,0)} <span class="muted small">kcal</span></div></div></div>${bar(t.kcal,db.goals.kcal)}</div><button class="secondary wide" data-action="photo" style="margin:10px 0">📷 Adicionar com ajuda de uma foto</button><button class="secondary wide" data-action="tools" style="margin:0 0 10px">✦ Ferramentas: código de barras, copiar refeições e evolução</button><button class="secondary wide" data-action="progress" style="margin:0 0 10px">⚖️ Registrar peso de hoje e conferir a semana</button><div class="sectiontitle">Refeições</div>${MEALS.map(m=>{let x=sum(byMeal(m));return `<div class="card meal"><div class="mealhead"><strong>${m}</strong><button data-action="openmeal" data-meal="${esc(m)}" aria-label="Editar ${esc(m)}">✎</button></div><div class="mealstats">${fmt(x.kcal,0)} kcal</div><div class="mealstats"><span>P: ${fmt(x.p)}g</span><span>C: ${fmt(x.c)}g</span><span>G: ${fmt(x.f)}g</span></div>${bar(x.kcal,db.goals.kcal)}</div>`}).join('')}<div class="footerhint">Itens TACO: NEPA/UNICAMP, Tabela Brasileira de Composição de Alimentos, 4ª edição (2011), por 100 g. Outros valores alimentares de referência são aproximados por 100 g ou 100 ml. Confira marcas, modo de preparo e óleo utilizado. Sua meta é um ponto de partida, não um limite médico.</div>`}
function meal(){let arr=byMeal(state.meal);return head(state.meal)+`${arr.length?arr.map(x=>{let energy=[x.c*4,x.p*4,x.f*9],tot=energy.reduce((a,b)=>a+b,0)||1;return `<div class="item"><div class="itemhead"><div><b>${esc(x.name)}</b> <span class="muted">— ${fmt(x.grams)}${esc(x.unit||'g')}</span></div><div style="display:flex;gap:5px"><button class="chip" data-action="editfoodentry" data-id="${esc(x.id)}" aria-label="Editar os valores nutricionais deste alimento em todos os dias">Editar alimento</button><button class="dots" data-action="entrymenu" data-id="${esc(x.id)}" aria-label="Opções">⋮</button></div></div><div class="itembody"><div class="miniring" style="background:conic-gradient(var(--yellow) 0 ${energy[0]/tot*360}deg,var(--green) ${energy[0]/tot*360}deg ${(energy[0]+energy[1])/tot*360}deg,#48505a ${(energy[0]+energy[1])/tot*360}deg 360deg)"><span><b>${fmt(x.kcal,0)}</b><br>kcal</span></div><div class="macrogrid"><div><span style="color:#7de9a9">${fmt(energy[0]/tot*100,0)}%</span><strong>${fmt(x.c)}g</strong><small>Carb</small><div class="dash"></div></div><div><span style="color:#7de9a9">${fmt(energy[1]/tot*100,0)}%</span><strong>${fmt(x.p)}g</strong><small>Proteína</small><div class="dash green"></div></div><div><span style="color:#7de9a9">${fmt(energy[2]/tot*100,0)}%</span><strong>${fmt(x.f)}g</strong><small>Gordura</small><div class="dash grey"></div></div></div></div></div>`}).join(''):'<div class="empty">Nenhum alimento registrado nesta refeição.</div>'}<button class="primary" data-action="search">+ Adicionar alimento</button>`}
function listFoods(){let s=state.search.trim().toLocaleLowerCase('pt-BR');let a=allFoods();if(s){let norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let q=norm(s);a=a.filter(f=>norm(f.name).includes(q))}else if(state.filter==='recent'){a=db.recent.map(id=>a.find(f=>f.id===id)).filter(Boolean)}else if(state.filter==='added'){a=db.custom}else{let popular=['Arroz branco cozido','Pão francês','Feijão carioca cozido','Ovo mexido sem óleo','Queijo muçarela','Café coado sem açúcar (100 ml)','Banana prata','Peito de frango grelhado','Macarrão cozido sem molho','Leite integral (100 ml)','Batata-doce cozida','Aveia em flocos'];a=popular.map(n=>a.find(f=>f.name===n)).filter(Boolean)}return a.slice(0,100).map(f=>`<div class="foodrow"><div style="min-width:0;flex:1"><div class="foodname">${esc(f.name)}</div><div class="sub">${f.source==='TACO'?'TACO · ':''}100 ${f.unit||'g'} · P ${fmt(f.p)}g · C ${fmt(f.c)}g · G ${fmt(f.f)}g</div></div><div class="right">${fmt(f.kcal,0)} kcal</div><button class="chip" data-action="editfood" data-id="${esc(f.id)}" aria-label="Editar ${esc(f.name)}">✎</button><button class="roundadd" data-action="selectfood" data-id="${esc(f.id)}" aria-label="Adicionar ${esc(f.name)}">+</button></div>`).join('')||'<div class="empty">Nenhum alimento encontrado. Use + para cadastrar um alimento do rótulo.</div>'}
function search(){return head(state.meal)+`<div class="searchrow"><input class="input" id="search" type="search" placeholder="⌕  Buscar alimento" value="${esc(state.search)}" autocomplete="off"><button data-action="newfood" aria-label="Cadastrar alimento">＋</button></div><div class="segments">${[['popular','Populares'],['recent','Recentes'],['added','Adicionados']].map(([id,n])=>`<button data-action="filter" data-filter="${id}" class="${state.filter===id?'active':''}">${n}</button>`).join('')}</div><div class="rowflex"><span class="hint">${TACO_FOODS.length} itens TACO + ${FOODS.length+EXTRA_FOODS.length} referências antigas + seus cadastros</span><span class="hint">Por 100 g/ml</span></div><div id="foodlist" style="margin-top:12px">${listFoods()}</div>`}
function add(){let f=allFoods().find(x=>x.id===state.selected);if(!f)return search();let g=Number(state.amount||100);let scaled=k=>f[k]*g/100;return head('Adicionar alimento')+`<div class="card"><h2 style="margin:0">${esc(f.name)}</h2><p class="hint">${f.source==='TACO'?`TACO/NEPA-UNICAMP (2011), item ${f.tacoId}. Valores por 100 g.`:`Referência: 100 ${f.unit||'g'}. Confira o rótulo quando houver.`} ${fmt(f.kcal,0)} kcal.</p><label class="fieldlabel">Quantidade (${f.unit||'g'})</label><input class="input" id="amount" type="number" min="0.1" max="20000" step="0.1" value="${g}"><div class="chips">${[20,50,100,150,200,250].map(n=>`<button class="chip" data-action="amount" data-amount="${n}">${n}${f.unit||'g'}</button>`).join('')}</div><div class="preview" id="foodpreview">${fmt(scaled('kcal'),0)} kcal · P ${fmt(scaled('p'))}g · C ${fmt(scaled('c'))}g · G ${fmt(scaled('f'))}g</div><label class="fieldlabel">Refeição</label><select id="mealSelect">${MEALS.map(m=>`<option ${m===state.meal?'selected':''}>${m}</option>`).join('')}</select><button class="primary" data-action="saveentry">Adicionar à refeição</button><button class="secondary wide" style="margin-top:10px" data-action="editfood" data-id="${esc(f.id)}">✎ Corrigir informações nutricionais deste alimento</button></div>`}
function photo(){return head('Foto da refeição')+`<div class="card"><h2>Registrar usando foto 📷</h2><p class="hint">Fotografe seu prato para consultar enquanto registra os ingredientes. Nesta versão a imagem não é enviada a servidores nem analisada automaticamente por IA.</p><label class="fieldlabel">Tirar foto ou escolher imagem</label><input class="input" id="foodphoto" type="file" accept="image/*" capture="environment"><div id="photoarea">${state.photoUrl?`<img class="photo-frame" src="${state.photoUrl}" alt="Foto selecionada">`:''}</div><div class="warning">⚠️ Uma foto isolada não determina o peso exato, o óleo ou os ingredientes ocultos. Para calcular macros com menor erro, selecione cada alimento e informe sua porção em gramas.</div><button class="primary" data-action="photosearch">Selecionar alimentos do prato →</button><p class="hint">Análise assistida gratuita: a foto não identifica automaticamente os ingredientes.</p><p class="hint">A foto é temporária: não será salva no histórico nem incluída no backup. Os alimentos adicionados, sim.</p></div>`}
function weekly(){let dates=Array.from({length:7},(_,i)=>{let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()-(6-i));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`});let values=dates.map(d=>sum(db.entries.filter(x=>x.date===d)));let max=Math.max(db.goals.kcal,...values.map(x=>x.kcal),1);let recorded=values.filter((x,i)=>db.entries.some(e=>e.date===dates[i]));let avg=recorded.length?recorded.reduce((a,x)=>a+x.kcal,0)/recorded.length:0;return `<div class="card"><h2>Últimos 7 dias</h2><div class="weekbars">${dates.map((d,i)=>`<div class="weekbar"><div style="height:${Math.max(2,values[i].kcal/max*90)}px" title="${fmt(values[i].kcal,0)} kcal"></div><span>${d.slice(8)}</span></div>`).join('')}</div><p class="hint">Média dos dias com registros: <b>${fmt(avg,0)} kcal</b> · ${recorded.length} de 7 dias registrados. Dias sem refeições não entram na média.</p></div>`}
function settings(){return `<div class="top"><h1>Configurações</h1></div><div class="card"><h2>Minhas metas diárias</h2><div class="formgrid">${[['kcal','Calorias (kcal)'],['p','Proteína (g)'],['c','Carboidrato (g)'],['f','Gordura (g)']].map(([k,label])=>`<div><label class="fieldlabel">${label}</label><input class="input" id="goal_${k}" type="number" min="0" step="0.1" value="${db.goals[k]}"></div>`).join('')}</div><button class="primary" data-action="savegoals">Salvar metas</button><p class="hint">As metas de macros podem não somar exatamente as calorias devido a arredondamentos.</p></div><div class="card"><h2>Conta e sincronização ☁️</h2><p id="cloud-status" class="hint">Verificando conexão com Firebase…</p><div id="cloud-user" class="hint"></div><button class="primary" id="cloud-login" type="button">Entrar com Google</button><button class="secondary wide" id="cloud-sync" type="button" style="display:none;margin-top:10px">Sincronizar agora</button><button class="secondary wide" id="cloud-logout" type="button" style="display:none;margin-top:10px">Sair da conta</button><p class="hint">No primeiro acesso, confirme a importação dos registros deste aparelho. Mantenha seu backup JSON. Os dados só serão enviados após sua autorização.</p></div><div class="card"><h2>Seus dados</h2><p class="hint">Os dados ficam neste navegador e, quando conectado ao Google, são sincronizados no Firebase. Exporte backups periódicos para ter uma cópia independente.</p><button class="secondary wide" data-action="export">↓ Exportar backup JSON</button><label class="fieldlabel">Importar backup</label><input type="file" id="importfile" accept=".json,application/json" class="input"><p class="hint">A importação substitui os registros atuais. Exporte antes.</p><button class="secondary wide" data-action="clear" style="margin-top:12px">Apagar meus registros</button></div><div class="card"><h2>Novidades 3.4</h2><button class="primary" data-action="tools">Abrir ferramentas gratuitas</button></div><div class="card"><h2>Banco de alimentos</h2><p class="hint">${TACO_FOODS.length} itens da TACO 4ª edição (2011) e ${FOODS.length+EXTRA_FOODS.length} referências anteriores, além dos seus cadastros. Pesos são da porção comestível. Alimento cru e cozido não são equivalentes; gordura de preparo deve ser registrada separadamente.</p><button class="secondary wide" data-action="newfood">+ Cadastrar alimento do rótulo</button></div>`}
const normName=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
function foodform(){let base=allFoods().find(x=>x.id===state.editId);let legacy=state.editEntryId?db.entries.find(x=>x.id===state.editEntryId):null;let f=base|| (legacy?{name:legacy.name,unit:legacy.unit||'g',...Object.fromEntries(['kcal','p','c','f'].map(k=>[k,Number(legacy[k]||0)/(Number(legacy.grams)||100)*100]))}:state.pendingBarcode)||{name:'',unit:'g',kcal:0,p:0,c:0,f:0};let editing=!!base||!!legacy;let count=editing?db.entries.filter(x=>(base && x.foodId===base.id)||(!x.foodId&&normName(x.name)===normName(f.name)&&x.unit===f.unit)).length:0;return head(editing?'Editar valores nutricionais':'Cadastrar alimento')+`<div class="card"><h2>${editing?'Corrigir alimento em todos os dias':'Cadastrar alimento'}</h2><p class="hint">Valores por 100 g ou 100 ml. Se você alterar um alimento já consumido, as calorias e macros de ${count} lançamento(s) relacionado(s), inclusive em datas antigas, serão recalculados. A quantidade de cada porção será preservada.</p><label class="fieldlabel">Nome do alimento / marca</label><input class="input" id="fname" maxlength="120" value="${esc(f.name)}" placeholder="Ex.: Shake Herbalife"><label class="fieldlabel">Unidade</label><select id="funit"><option value="g" ${f.unit!=='ml'?'selected':''}>gramas (g)</option><option value="ml" ${f.unit==='ml'?'selected':''}>mililitros (ml)</option></select><div class="formgrid">${[['kcal','Calorias (kcal)'],['p','Proteínas (g)'],['c','Carboidratos (g)'],['f','Gorduras (g)']].map(([k,n])=>`<div><label class="fieldlabel">${n}</label><input class="input" type="number" min="0" max="1000" step="0.01" id="f_${k}" value="${Number(f[k]||0)}"></div>`).join('')}</div>${state.pendingBarcode?.barcode?`<p class="hint">Código de barras: ${esc(state.pendingBarcode.barcode)}</p>`:''}<button class="primary wide" data-action="savefood">${editing?'Salvar e corrigir dias anteriores':'Salvar alimento'}</button></div><p class="hint">Para produtos industrializados, use a informação por 100 g/100 ml do rótulo e confirme a unidade. O registro anterior não será excluído ou duplicado.</p>`}
function macros(){let t=totals();return `<div class="top"><h1>Macros</h1></div><div class="card"><h2 style="margin-top:0">Resumo de ${esc(state.date.split('-').reverse().join('/'))}</h2><div class="statnumber">${fmt(t.kcal,0)} <span class="muted small">/ ${fmt(db.goals.kcal,0)} kcal</span></div>${bar(t.kcal,db.goals.kcal)}<div style="margin-top:20px">${macroLine('Proteína',t.p,db.goals.p)}${macroLine('Carboidrato',t.c,db.goals.c)}${macroLine('Gordura',t.f,db.goals.f)}</div></div><div class="sectiontitle">Distribuição por refeição</div>${MEALS.map(m=>{let a=sum(byMeal(m));return `<div class="card"><div class="rowflex"><b>${m}</b><b>${fmt(a.kcal,0)} kcal</b></div><div class="mealstats">P: ${fmt(a.p)}g &nbsp; C: ${fmt(a.c)}g &nbsp; G: ${fmt(a.f)}g</div>${bar(a.kcal,db.goals.kcal)}</div>`}).join('')}<p class="hint">Calorias informadas nas tabelas podem diferir de 4 × proteína + 4 × carboidrato + 9 × gordura, por fibras, arredondamentos e metodologias de rotulagem.</p>`}
function history(){let dates=[...new Set(db.entries.map(x=>x.date))].sort().reverse();let selected=state.date;let arr=db.entries.filter(x=>x.date===selected);let t=sum(arr);let label=d=>d.split('-').reverse().join('/');return `<div class="top"><h1>Diário alimentar</h1></div><div class="card"><label class="fieldlabel" for="historyday">Escolha o dia para consultar</label><div class="datebar"><button class="chip" data-action="prev">‹</button><input class="input" type="date" id="historyday" value="${selected}"><button class="chip" data-action="next">›</button></div><div class="rowflex"><b>${label(selected)}</b><button class="textbtn" data-action="today">Ir para hoje</button></div><div class="statnumber">${fmt(t.kcal,0)} <span class="muted small">/ ${fmt(db.goals.kcal,0)} kcal</span></div>${bar(t.kcal,db.goals.kcal)}<p class="mealstats">P: ${fmt(t.p)}g &nbsp; C: ${fmt(t.c)}g &nbsp; G: ${fmt(t.f)}g</p></div><button class="secondary wide" data-action="photo" style="margin-bottom:14px">📷 Registrar refeição com foto (assistido)</button><div class="sectiontitle">Refeições deste dia</div>${MEALS.map(m=>{let items=arr.filter(x=>x.meal===m),v=sum(items);return `<div class="card"><div class="rowflex"><strong>${m}</strong><button class="textbtn" data-action="openmeal" data-meal="${esc(m)}">${items.length?'Ver / editar':'+ Adicionar'}</button></div><div class="mealstats">${fmt(v.kcal,0)} kcal · P ${fmt(v.p)}g · C ${fmt(v.c)}g · G ${fmt(v.f)}g</div>${items.length?items.map(x=>`<div class="historyrow"><div style="min-width:0;flex:1"><b>${esc(x.name)}</b><div class="hint">${fmt(x.grams)} ${esc(x.unit||'g')} · P ${fmt(x.p)}g · C ${fmt(x.c)}g · G ${fmt(x.f)}g</div></div><div style="text-align:right;white-space:nowrap">${fmt(x.kcal,0)} kcal<br><button class="textbtn" data-action="editfoodentry" data-id="${esc(x.id)}">Editar valores</button></div></div>`).join(''):'<p class="hint">Nenhum alimento registrado.</p>'}</div>`}).join('')}${weekly()}<div class="sectiontitle">Outros dias com registros</div><div class="card">${dates.length?dates.map(d=>{let x=sum(db.entries.filter(y=>y.date===d));return `<div class="historyrow"><button class="textbtn" data-action="gotodatehistory" data-date="${d}">${label(d)}</button><span>${fmt(x.kcal,0)} kcal</span></div>`}).join(''):'<p class="hint">Ainda não há outros registros.</p>'}</div><p class="hint">As refeições são salvas automaticamente neste navegador. Para não perdê-las ao trocar de aparelho ou limpar os dados, exporte o backup em Configurações.</p>`}

function toolsPage(){return head('Ferramentas 3.4')+`<div class="card"><h2>📷 Foto da comida</h2><p class="hint">Tire uma foto e registre os ingredientes com porções estimadas; sem IA paga ou reconhecimento automático.</p><button class="primary" data-action="photo">Abrir foto assistida</button></div><div class="card"><h2>▥ Código de barras</h2><p class="hint">Pesquise um produto pelo código EAN/UPC. A câmera tenta ler o código onde o navegador permitir; digitar funciona no iPhone.</p><button class="primary" data-action="barcode">Consultar produto</button></div><div class="card"><h2>↗ Copiar refeição</h2><label class="fieldlabel">Data de origem</label><input class="input" id="copydate" type="date" value="${state.date}"><label class="fieldlabel">Refeição de origem</label><select id="copymeal">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select><label class="fieldlabel">Data de destino</label><input class="input" id="copytarget" type="date" value="${today()}"><button class="primary" data-action="copymeal">Copiar alimentos para a data escolhida</button><p class="hint">Cópias recebem novos IDs e são sincronizadas normalmente.</p></div><div class="card"><h2>📈 Evolução corporal</h2><p class="hint">Peso, cintura e gráfico histórico; dados também entram no backup e na sincronização.</p><button class="primary" data-action="progress">Abrir evolução corporal</button></div><div class="card"><h2>🥗 Catálogo ampliado</h2><p class="hint">${TACO_FOODS.length} itens TACO e ${FOODS.length+EXTRA_FOODS.length} referências antigas, além dos cadastros próprios. Prefira rótulos para produtos específicos.</p><button class="secondary wide" data-action="photosearch">Pesquisar alimentos</button></div>`}
function progressPage(){
 let a=[...(db.measurements||[])].filter(x=>Number.isFinite(Number(x.weight))&&Number(x.weight)>=20&&Number(x.weight)<=400).sort((x,y)=>x.date.localeCompare(y.date));
 let groups=new Map();for(let x of a){let d=new Date(x.date+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);let key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(Number(x.weight));}
 let wk=[...groups].sort((a,b)=>a[0].localeCompare(b[0])).map(([start,weights])=>({start,average:weights.reduce((s,v)=>s+v,0)/weights.length,count:weights.length}));
 let low=Math.min(...wk.map(x=>x.average),0),high=Math.max(...wk.map(x=>x.average),1),range=high-low||1;
 if(wk.length){low=Math.min(...wk.map(x=>x.average))-0.3;high=Math.max(...wk.map(x=>x.average))+0.3;range=high-low||1;}
 let points=wk.map((x,i)=>`${wk.length===1?50:8+i/(wk.length-1)*84},${88-(x.average-low)/range*73}`).join(' ');
 let latest=wk.at(-1),prev=wk.at(-2),diff=prev?latest.average-prev.average:null;
 let weightToday=a.find(x=>x.date===today()),first=a[0];
 return head('Peso diário e evolução semanal')+`<div class="card"><h2>⚖️ Registrar peso do dia</h2><p class="hint">Registre de preferência pela manhã, em condições semelhantes. Salvar novamente a mesma data atualiza o peso, sem duplicar.</p><label class="fieldlabel">Data</label><input id="measuredate" class="input" type="date" value="${today()}"><div class="formgrid"><div><label class="fieldlabel">Peso (kg)</label><input id="measureweight" class="input" type="number" min="20" max="400" step="0.01" placeholder="Ex.: 77,2" value="${weightToday?.weight??''}"></div><div><label class="fieldlabel">Cintura (cm, opcional)</label><input id="measurewaist" class="input" type="number" min="0" max="300" step="0.1" value="${weightToday?.waist||''}"></div></div><button class="primary wide" data-action="savemeasure">Salvar peso do dia</button></div>

async function lookupBarcode(raw){

  let obj=j.product,n=obj.nutriments||{};

  let name=[obj.product_name_pt||obj.product_name||'',obj.brands||''].filter(Boolean).join(' — ')||'Produto '+code;
  let missing=Object.keys(vals).filter(k=>vals[k]===null);

  }

}

// Meu Shape 3.4. Local data and cloud patch helpers.
const numberValue=v=>Number(String(v??'').replace(',','.'));
const clone=v=>JSON.parse(JSON.stringify(v));
function validDate(v){if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===v}
function normalizeShape(o){
 if(!o||typeof o!=='object'||Array.isArray(o))throw Error('Backup inválido');
 const out={goals:{kcal:2300,p:155,c:262,f:70,...o.goals},entries:[],custom:[],measurements:[],foodOverrides:{},recent:[],favorites:[],deletedEntryIds:[],deletedMeasurementDates:[]};
 for(const k of ['entries','custom','measurements','recent','favorites','deletedEntryIds','deletedMeasurementDates'])if(Array.isArray(o[k]))out[k]=clone(o[k]);
 if(o.foodOverrides&&typeof o.foodOverrides==='object'&&!Array.isArray(o.foodOverrides))out.foodOverrides=clone(o.foodOverrides);
 for(const [id,x] of Object.entries(out.foodOverrides)){if(!x||typeof x.name!=='string'||!['g','ml'].includes(x.unit)||['kcal','p','c','f'].some(k=>!Number.isFinite(x[k])||x[k]<0))throw Error('Correção de alimento inválida')}
 for(const k of ['kcal','p','c','f'])if(!Number.isFinite(Number(out.goals[k]))||Number(out.goals[k])<0||Number(out.goals[k])>10000)throw Error('Metas inválidas');
 const clean=(arr,key)=>[...new Map(arr.map(x=>[String(x[key]),x])).values()];
 for(const k of ['entries','custom']){for(const x of out[k]){if(!x||typeof x.id!=='string'||!x.id||typeof x.name!=='string'||!['g','ml'].includes(x.unit||'g')||['kcal','p','c','f'].some(n=>!Number.isFinite(x[n])||x[n]<0))throw Error('Alimento ou registro inválido');if(k==='entries'&&(!validDate(x.date)||!(x.grams>0&&x.grams<=20000)||!MEALS.includes(x.meal)))throw Error('Lançamento inválido')}out[k]=clean(out[k],'id')}
 for(const x of out.measurements)if(!x||!validDate(x.date)||!(x.weight>=20&&x.weight<=400)||!Number.isFinite(Number(x.weight)))throw Error('Medida inválida');
 out.measurements=clean(out.measurements,'date');out.deletedEntryIds=out.deletedEntryIds.filter(x=>typeof x==='string');out.deletedMeasurementDates=out.deletedMeasurementDates.filter(validDate);
 out.entries=out.entries.filter(x=>!out.deletedEntryIds.includes(x.id));out.measurements=out.measurements.filter(x=>!out.deletedMeasurementDates.includes(x.date));out.schemaVersion=34;return out;
}
function changesBetween(base,next){
 base=normalizeShape(base);next=normalizeShape(next);const patch={lists:{},maps:{},sets:{}};
 for(const [field,key] of [['entries','id'],['custom','id'],['measurements','date']]){const a=new Map(base[field].map(x=>[x[key],x])),b=new Map(next[field].map(x=>[x[key],x]));patch.lists[field]={up:next[field].filter(x=>JSON.stringify(a.get(x[key]))!==JSON.stringify(x)),del:[...a.keys()].filter(id=>!b.has(id))}}
 for(const field of ['goals','foodOverrides']){patch.maps[field]={};for(const key of new Set([...Object.keys(base[field]),...Object.keys(next[field])]))if(JSON.stringify(base[field][key])!==JSON.stringify(next[field][key]))patch.maps[field][key]=next[field][key]??null}
 for(const field of ['recent','favorites','deletedEntryIds','deletedMeasurementDates'])patch.sets[field]={add:next[field].filter(x=>!base[field].includes(x)),del:base[field].filter(x=>!next[field].includes(x)&&(field==='deletedEntryIds'?next.entries.some(e=>e.id===x):field==='deletedMeasurementDates'?next.measurements.some(e=>e.date===x):true))};return patch;
}
function applyChanges(remote,patch){
 const out=normalizeShape(remote);
 for(const [field,key] of [['entries','id'],['custom','id'],['measurements','date']]){const p=patch.lists[field],map=new Map(out[field].map(x=>[x[key],x]));for(const id of p.del)map.delete(id);for(const x of p.up)map.set(x[key],clone(x));out[field]=[...map.values()]}
 for(const field of ['goals','foodOverrides'])for(const [key,val] of Object.entries(patch.maps[field])){if(val===null)delete out[field][key];else out[field][key]=clone(val)}
 for(const [field,p] of Object.entries(patch.sets))out[field]=[...new Set([...p.add,...out[field].filter(x=>!p.del.includes(x))])];out.recent=out.recent.slice(0,30);out.deletedEntryIds=[...new Set([...out.deletedEntryIds,...patch.lists.entries.del])];out.deletedMeasurementDates=[...new Set([...out.deletedMeasurementDates,...patch.lists.measurements.del])];return normalizeShape(out);
}

function loadMeta(uid){try{const meta=JSON.parse(localStorage.getItem('meushape_sync34'));if(meta?.uid===uid){base=normalizeShape(meta.base);lastSync=meta.lastSync;return true}}catch(e){}base=null;lastSync=null;return false}
function remember(uid){localStorage.setItem('meushape_sync34',JSON.stringify({uid,base,lastSync}));localStorage.setItem('meushape_owner34',uid)}
function countConflicts(remote,old,patch){let count=0;for(const [field,key] of [['entries','id'],['custom','id'],['measurements','date']]){const r=new Map(remote[field].map(x=>[x[key],x])),b=new Map(old[field].map(x=>[x[key],x]));for(const x of patch.lists[field].up)if(b.has(x[key])&&JSON.stringify(r.get(x[key]))!==JSON.stringify(b.get(x[key]))&&JSON.stringify(r.get(x[key]))!==JSON.stringify(x))count++}return count}
async function synchronize(){
 if(!user||busy||tabLocked)return;if(navigator.onLine===false){status='Salvo neste aparelho · sem conexão. A sincronização será tentada quando a conexão voltar.';updateUI();return}
 busy=true;ready=false;let completed=false;clearTimeout(timer);const target=user.uid,token=generation;status='Sincronizando… seus registros continuam salvos neste aparelho.';updateUI();
 try{
  let start=normalizeShape(clone(db)),initialBase=base,firstMode='patch',switchedAccount=false;
  if(!initialBase){const snap=await getDoc(refFor(target));if(token!==generation)return;const remote=normalizeShape(snap.exists()?snap.data():{}),owner=localStorage.getItem('meushape_owner34');
   if(owner&&owner!==target){if(!confirm('Este aparelho contém dados de outra conta. Guardar uma cópia local e carregar somente os dados da conta atual? Nenhum dado da outra conta será enviado.')){status='Troca de conta pendente. Os dados locais foram preservados.';return}localStorage.setItem('meushape_previous_account',JSON.stringify(start));firstMode='cloud';switchedAccount=true;}
   else if(hasData(start)&&(pending()||!hasData(remote))){if(!confirm('Unir os dados deste aparelho com a conta Google? Registros com o mesmo ID não serão duplicados. Em alterações do mesmo registro, esta cópia local prevalece.')){status='Salvo neste aparelho · união com a conta não autorizada.';return}firstMode='merge';}
   else firstMode='cloud';
   initialBase=firstMode==='merge'?emptyShape():start;
  }
  const patch=changesBetween(initialBase,start),sentBase=initialBase;
  const result=await runTransaction(store,async tx=>{
   const snap=await tx.get(refFor(target));const remote=normalizeShape(snap.exists()?snap.data():{});
   const merged=firstMode==='cloud'?remote:applyChanges(remote,patch),conflicts=countConflicts(remote,sentBase,patch);
   if(firstMode!=='cloud'){
    const payload={...merged,schemaVersion:34,updatedAt:new Date().toISOString()};
    if(new TextEncoder().encode(JSON.stringify(payload)).length>950000)throw Error('O diário está perto do limite de tamanho da nuvem. Exporte um backup; os dados locais foram mantidos.');
    tx.set(refFor(target),payload);
   }
   return {merged,conflicts};
  });
  if(token!==generation)return;
  // Preserve edits made while Firestore was reading or committing.
  const during=changesBetween(start,normalizeShape(db));if(switchedAccount)localStorage.setItem('meushape_previous_account',JSON.stringify(db));db=switchedAccount?result.merged:applyChanges(result.merged,during);base=result.merged;lastSync=new Date().toISOString();
  localStorage.setItem(KEY,JSON.stringify(db));remember(target);
  const remaining=JSON.stringify(changesBetween(base,db))!==JSON.stringify(changesBetween(base,base));
  if(remaining)localStorage.setItem('meushape_pending_v33','1');else localStorage.removeItem('meushape_pending_v33');
  ready=true;status=remaining?'Salvo neste aparelho · novas alterações aguardam envio.':'✓ Salvo na nuvem';if(result.conflicts)status+=' · '+result.conflicts+' conflito(s): alterações locais prevaleceram';render();completed=true;
 }catch(e){status='Salvo neste aparelho · sincronização não concluída: '+e.message+'. Use Sincronizar agora para tentar novamente.';ready=!!base;}
 finally{busy=false;updateUI();if(completed&&pending()&&ready)queueUpload()}
}
function queueUpload(){clearTimeout(timer);if(tabLocked)return;if(!user){status='Salvo neste aparelho · entre com Google para sincronizar.';updateUI();return}status='Salvo neste aparelho · alterações aguardam sincronização.';updateUI();if(!busy)timer=setTimeout(synchronize,1500)}
window.addEventListener('shape:changed',queueUpload);window.addEventListener('shape:render',updateUI);
window.addEventListener('offline',()=>{clearTimeout(timer);status='Salvo neste aparelho · sem conexão.';updateUI()});
window.addEventListener('online',()=>{if(user)synchronize();else updateUI()});
// Do not silently overwrite unsaved edits from a second tab.
window.addEventListener('storage',e=>{if(e.key===KEY){tabLocked=true;window.shapeTabLocked=true;status='O diário foi alterado em outra aba. Feche esta aba e continue na outra para evitar sobrescritas.';ready=false;clearTimeout(timer);updateUI()}});
document.addEventListener('click',e=>{if(tabLocked){e.preventDefault();e.stopImmediatePropagation();alert('Outra aba alterou este diário. Atualize esta página antes de continuar.')}},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&user&&ready&&!busy)synchronize()});
document.addEventListener('click',async e=>{
 const id=e.target.closest('button')?.id;
 if(id==='cloud-login'){try{status='Abrindo login Google…';updateUI();await signInWithPopup(auth,provider)}catch(err){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(err.code)){try{await signInWithRedirect(auth,provider)}catch(e2){status='Não foi possível entrar: '+e2.message;updateUI()}}else{status='Não foi possível entrar: '+err.message;updateUI()}}}
 if(id==='cloud-sync')synchronize();
 if(id==='cloud-logout'){if(busy){alert('Aguarde a sincronização terminar antes de sair.');return}if(pending()&&!confirm('Há alterações salvas somente neste aparelho. Sair mesmo assim? Elas permanecerão aqui.'))return;generation++;clearTimeout(timer);ready=false;await signOut(auth);status='Salvo neste aparelho · conta desconectada.';updateUI()}
});
getRedirectResult(auth).catch(e=>{status='Falha ao retornar do login: '+e.message;updateUI()});
onAuthStateChanged(auth,async u=>{generation++;user=u;ready=false;if(u){loadMeta(u.uid);await synchronize()}else{base=null;lastSync=null;status='Salvo neste aparelho · entre com Google para sincronizar.';updateUI()}});
updateUI();

</script></body></html>
