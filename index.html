function head(title,back){return `<div class="top"><div class="rowflex"><button class="back" data-action="back" aria-label="Voltar">‹</button><h1>${esc(title)}</h1></div></div>`}
function macroLine(label,v,g){return `<div class="macro"><div class="macrohead"><span>${label}</span><span><b>${fmt(v)}g</b><em> / ${fmt(g)}g</em></span></div>${bar(v,g)}</div>`}
function home(){let t=totals(),remain=Math.round(db.goals.kcal-t.kcal);let angle=Math.round(pct(t.kcal,db.goals.kcal)*3.6);return `<div class="top"><h1>Hoje</h1><div class="actions"><button class="iconbtn" data-action="history" aria-label="Histórico">▤</button><button class="iconbtn" data-action="settings" aria-label="Configurações">⚙</button></div></div><div class="datebar"><button class="chip" data-action="prev">‹</button><input class="input" type="date" id="day" value="${state.date}"><button class="chip" data-action="next">›</button></div><div class="card summary"><div class="ring" style="--progress:${angle}deg"><div class="ringtext"><b>${fmt(Math.abs(remain),0)}</b><span>${remain>=0?'restantes':'acima da meta'}</span></div></div><div>${macroLine('Proteína',t.p,db.goals.p)}${macroLine('Carboidrato',t.c,db.goals.c)}${macroLine('Gordura',t.f,db.goals.f)}</div></div><div class="card"><div class="rowflex"><div><span class="muted small">Consumidas</span><div class="statnumber">${fmt(t.kcal,0)} <span class="muted small">kcal</span></div></div><div style="text-align:right"><span class="muted small">Meta diária</span><div class="statnumber">${fmt(db.goals.kcal,0)} <span class="muted small">kcal</span></div></div></div>${bar(t.kcal,db.goals.kcal)}</div><button class="secondary wide" data-action="photo" style="margin:10px 0">📷 Adicionar com ajuda de uma foto</button><button class="secondary wide" data-action="tools" style="margin:0 0 10px">✦ Ferramentas: código de barras, copiar refeições e evolução</button><div class="sectiontitle">Refeições</div>${MEALS.map(m=>{let x=sum(byMeal(m));return `<div class="card meal"><div class="mealhead"><strong>${m}</strong><button data-action="openmeal" data-meal="${esc(m)}" aria-label="Editar ${esc(m)}">✎</button></div><div class="mealstats">${fmt(x.kcal,0)} kcal</div><div class="mealstats"><span>P: ${fmt(x.p)}g</span><span>C: ${fmt(x.c)}g</span><span>G: ${fmt(x.f)}g</span></div>${bar(x.kcal,db.goals.kcal)}</div>`}).join('')}<div class="footerhint">Valores alimentares de referência são aproximados por 100 g ou 100 ml. Confira marcas, modo de preparo e óleo utilizado. Sua meta é um ponto de partida, não um limite médico.</div>`}
function meal(){let arr=byMeal(state.meal);return head(state.meal)+`${arr.length?arr.map(x=>{let energy=[x.c*4,x.p*4,x.f*9],tot=energy.reduce((a,b)=>a+b,0)||1;return `<div class="item"><div class="itemhead"><div><b>${esc(x.name)}</b> <span class="muted">— ${fmt(x.grams)}${esc(x.unit||'g')}</span></div><button class="dots" data-action="entrymenu" data-id="${esc(x.id)}" aria-label="Opções">⋮</button></div><div class="itembody"><div class="miniring" style="background:conic-gradient(var(--yellow) 0 ${energy[0]/tot*360}deg,var(--green) ${energy[0]/tot*360}deg ${(energy[0]+energy[1])/tot*360}deg,#48505a ${(energy[0]+energy[1])/tot*360}deg 360deg)"><span><b>${fmt(x.kcal,0)}</b><br>kcal</span></div><div class="macrogrid"><div><span style="color:#7de9a9">${fmt(energy[0]/tot*100,0)}%</span><strong>${fmt(x.c)}g</strong><small>Carb</small><div class="dash"></div></div><div><span style="color:#7de9a9">${fmt(energy[1]/tot*100,0)}%</span><strong>${fmt(x.p)}g</strong><small>Proteína</small><div class="dash green"></div></div><div><span style="color:#7de9a9">${fmt(energy[2]/tot*100,0)}%</span><strong>${fmt(x.f)}g</strong><small>Gordura</small><div class="dash grey"></div></div></div></div></div>`}).join(''):'<div class="empty">Nenhum alimento registrado nesta refeição.</div>'}<button class="primary" data-action="search">+ Adicionar alimento</button>`}
function listFoods(){let s=state.search.trim().toLocaleLowerCase('pt-BR');let a=allFoods();if(s){let norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let q=norm(s);a=a.filter(f=>norm(f.name).includes(q))}else if(state.filter==='recent'){a=db.recent.map(id=>a.find(f=>f.id===id)).filter(Boolean)}else if(state.filter==='added'){a=db.custom}else{let popular=['Arroz branco cozido','Pão francês','Feijão carioca cozido','Ovo mexido sem óleo','Queijo muçarela','Café coado sem açúcar (100 ml)','Banana prata','Peito de frango grelhado','Macarrão cozido sem molho','Leite integral (100 ml)','Batata-doce cozida','Aveia em flocos'];a=popular.map(n=>a.find(f=>f.name===n)).filter(Boolean)}return a.slice(0,100).map(f=>`<div class="foodrow"><div style="min-width:0;flex:1"><div class="foodname">${esc(f.name)}</div><div class="sub">100${f.unit||'g'} · P ${fmt(f.p)}g · C ${fmt(f.c)}g · G ${fmt(f.f)}g</div></div><div class="right">${fmt(f.kcal,0)} kcal</div><button class="roundadd" data-action="selectfood" data-id="${esc(f.id)}" aria-label="Adicionar ${esc(f.name)}">+</button></div>`).join('')||'<div class="empty">Nenhum alimento encontrado. Use + para cadastrar um alimento do rótulo.</div>'}
function search(){return head(state.meal)+`<div class="searchrow"><input class="input" id="search" type="search" placeholder="⌕  Buscar alimento" value="${esc(state.search)}" autocomplete="off"><button data-action="newfood" aria-label="Cadastrar alimento">＋</button></div><div class="segments">${[['popular','Populares'],['recent','Recentes'],['added','Adicionados']].map(([id,n])=>`<button data-action="filter" data-filter="${id}" class="${state.filter===id?'active':''}">${n}</button>`).join('')}</div><div class="rowflex"><span class="hint">${FOODS.length+EXTRA_FOODS.length} alimentos de referência + seus cadastros</span><span class="hint">Por 100 g/ml</span></div><div id="foodlist" style="margin-top:12px">${listFoods()}</div>`}
function add(){let f=allFoods().find(x=>x.id===state.selected);if(!f)return search();let g=Number(state.amount||100);let scaled=k=>f[k]*g/100;return head('Adicionar alimento')+`<div class="card"><h2 style="margin:0">${esc(f.name)}</h2><p class="hint">Referência: 100 ${f.unit||'g'} · ${fmt(f.kcal,0)} kcal. Para produtos industrializados, prefira cadastrar os valores do rótulo.</p><label class="fieldlabel">Quantidade (${f.unit||'g'})</label><input class="input" id="amount" type="number" min="0.1" max="20000" step="0.1" value="${g}"><div class="chips">${[20,50,100,150,200,250].map(n=>`<button class="chip" data-action="amount" data-amount="${n}">${n}${f.unit||'g'}</button>`).join('')}</div><div class="preview" id="foodpreview">${fmt(scaled('kcal'),0)} kcal · P ${fmt(scaled('p'))}g · C ${fmt(scaled('c'))}g · G ${fmt(scaled('f'))}g</div><label class="fieldlabel">Refeição</label><select id="mealSelect">${MEALS.map(m=>`<option ${m===state.meal?'selected':''}>${m}</option>`).join('')}</select><button class="primary" data-action="saveentry">Adicionar à refeição</button></div>`}
function photo(){return head('Foto da refeição')+`<div class="card"><h2>Registrar usando foto 📷</h2><p class="hint">Fotografe seu prato para consultar enquanto registra os ingredientes. Nesta versão a imagem não é enviada a servidores nem analisada automaticamente por IA.</p><label class="fieldlabel">Tirar foto ou escolher imagem</label><input class="input" id="foodphoto" type="file" accept="image/*" capture="environment"><div id="photoarea">${state.photoUrl?`<img class="photo-frame" src="${state.photoUrl}" alt="Foto selecionada">`:''}</div><div class="warning">⚠️ Uma foto isolada não determina o peso exato, o óleo ou os ingredientes ocultos. Para calcular macros com menor erro, selecione cada alimento e informe sua porção em gramas.</div><button class="primary" data-action="photosearch">Selecionar alimentos do prato →</button><p class="hint">Análise assistida gratuita: a foto não identifica automaticamente os ingredientes.</p><p class="hint">A foto é temporária: não será salva no histórico nem incluída no backup. Os alimentos adicionados, sim.</p></div>`}
function weekly(){let dates=Array.from({length:7},(_,i)=>{let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()-(6-i));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`});let values=dates.map(d=>sum(db.entries.filter(x=>x.date===d)));let max=Math.max(db.goals.kcal,...values.map(x=>x.kcal),1);let recorded=values.filter((x,i)=>db.entries.some(e=>e.date===dates[i]));let avg=recorded.length?recorded.reduce((a,x)=>a+x.kcal,0)/recorded.length:0;return `<div class="card"><h2>Últimos 7 dias</h2><div class="weekbars">${dates.map((d,i)=>`<div class="weekbar"><div style="height:${Math.max(2,values[i].kcal/max*90)}px" title="${fmt(values[i].kcal,0)} kcal"></div><span>${d.slice(8)}</span></div>`).join('')}</div><p class="hint">Média dos dias com registros: <b>${fmt(avg,0)} kcal</b> · ${recorded.length} de 7 dias registrados. Dias sem refeições não entram na média.</p></div>`}
function settings(){return `<div class="top"><h1>Configurações</h1></div><div class="card"><h2>Minhas metas diárias</h2><div class="formgrid">${[['kcal','Calorias (kcal)'],['p','Proteína (g)'],['c','Carboidrato (g)'],['f','Gordura (g)']].map(([k,label])=>`<div><label class="fieldlabel">${label}</label><input class="input" id="goal_${k}" type="number" min="0" step="0.1" value="${db.goals[k]}"></div>`).join('')}</div><button class="primary" data-action="savegoals">Salvar metas</button><p class="hint">As metas de macros podem não somar exatamente as calorias devido a arredondamentos.</p></div><div class="card"><h2>Conta e sincronização ☁️</h2><p id="cloud-status" class="hint">Verificando conexão com Firebase…</p><div id="cloud-user" class="hint"></div><button class="primary" id="cloud-login" type="button">Entrar com Google</button><button class="secondary wide" id="cloud-sync" type="button" style="display:none;margin-top:10px">Sincronizar agora</button><button class="secondary wide" id="cloud-logout" type="button" style="display:none;margin-top:10px">Sair da conta</button><p class="hint">No primeiro acesso, confirme a importação dos registros deste aparelho. Mantenha seu backup JSON. Os dados só serão enviados após sua autorização.</p></div><div class="card"><h2>Seus dados</h2><p class="hint">Os registros ficam salvos neste navegador e podem ser perdidos se você limpar os dados do site ou trocar de aparelho.</p><button class="secondary wide" data-action="export">↓ Exportar backup JSON</button><label class="fieldlabel">Importar backup</label><input type="file" id="importfile" accept=".json,application/json" class="input"><p class="hint">A importação substitui os registros atuais. Exporte antes.</p><button class="secondary wide" data-action="clear" style="margin-top:12px">Apagar meus registros</button></div><div class="card"><h2>Novidades 3.2</h2><button class="primary" data-action="tools">Abrir ferramentas gratuitas</button></div><div class="card"><h2>Banco de alimentos</h2><p class="hint">${FOODS.length+EXTRA_FOODS.length} referências alimentares aproximadas, além dos seus alimentos personalizados. Pesos são da porção comestível. Alimento cru e cozido não são equivalentes; gordura de preparo deve ser registrada separadamente.</p><button class="secondary wide" data-action="newfood">+ Cadastrar alimento do rótulo</button></div>`}
function foodform(){return head('Meu alimento')+`<div class="card"><p class="hint">Cadastre por 100 g ou 100 ml. Copie os valores do rótulo e converta para 100 g/ml quando necessário.</p><label class="fieldlabel">Nome do alimento / marca</label><input class="input" id="fname" maxlength="120" placeholder="Ex.: Iogurte marca X"><label class="fieldlabel">Unidade</label><select id="funit"><option value="g">gramas (g)</option><option value="ml">mililitros (ml)</option></select><div class="formgrid">${[['kcal','Calorias (kcal)'],['p','Proteínas (g)'],['c','Carboidratos (g)'],['f','Gorduras (g)']].map(([k,n])=>`<div><label class="fieldlabel">${n}</label><input class="input" type="number" min="0" max="1000" step="0.01" id="f_${k}" value="0"></div>`).join('')}</div><button class="primary" data-action="savefood">Salvar alimento</button></div><p class="hint">Para mais precisão, registre óleo, molhos e acompanhamentos. Os valores variam entre marcas e receitas.</p>`}
function macros(){let t=totals();return `<div class="top"><h1>Macros</h1></div><div class="card"><h2 style="margin-top:0">Resumo de ${esc(state.date.split('-').reverse().join('/'))}</h2><div class="statnumber">${fmt(t.kcal,0)} <span class="muted small">/ ${fmt(db.goals.kcal,0)} kcal</span></div>${bar(t.kcal,db.goals.kcal)}<div style="margin-top:20px">${macroLine('Proteína',t.p,db.goals.p)}${macroLine('Carboidrato',t.c,db.goals.c)}${macroLine('Gordura',t.f,db.goals.f)}</div></div><div class="sectiontitle">Distribuição por refeição</div>${MEALS.map(m=>{let a=sum(byMeal(m));return `<div class="card"><div class="rowflex"><b>${m}</b><b>${fmt(a.kcal,0)} kcal</b></div><div class="mealstats">P: ${fmt(a.p)}g &nbsp; C: ${fmt(a.c)}g &nbsp; G: ${fmt(a.f)}g</div>${bar(a.kcal,db.goals.kcal)}</div>`}).join('')}<p class="hint">Calorias informadas nas tabelas podem diferir de 4 × proteína + 4 × carboidrato + 9 × gordura, por fibras, arredondamentos e metodologias de rotulagem.</p>`}
function history(){let dates=[...new Set(db.entries.map(x=>x.date))].sort().reverse();let selected=state.date;let arr=db.entries.filter(x=>x.date===selected);let t=sum(arr);let label=d=>d.split('-').reverse().join('/');return `<div class="top"><h1>Diário alimentar</h1></div><div class="card"><label class="fieldlabel" for="historyday">Escolha o dia para consultar</label><div class="datebar"><button class="chip" data-action="prev">‹</button><input class="input" type="date" id="historyday" value="${selected}"><button class="chip" data-action="next">›</button></div><div class="rowflex"><b>${label(selected)}</b><button class="textbtn" data-action="today">Ir para hoje</button></div><div class="statnumber">${fmt(t.kcal,0)} <span class="muted small">/ ${fmt(db.goals.kcal,0)} kcal</span></div>${bar(t.kcal,db.goals.kcal)}<p class="mealstats">P: ${fmt(t.p)}g &nbsp; C: ${fmt(t.c)}g &nbsp; G: ${fmt(t.f)}g</p></div><button class="secondary wide" data-action="photo" style="margin-bottom:14px">📷 Registrar refeição com foto (assistido)</button><div class="sectiontitle">Refeições deste dia</div>${MEALS.map(m=>{let items=arr.filter(x=>x.meal===m),v=sum(items);return `<div class="card"><div class="rowflex"><strong>${m}</strong><button class="textbtn" data-action="openmeal" data-meal="${esc(m)}">${items.length?'Ver / editar':'+ Adicionar'}</button></div><div class="mealstats">${fmt(v.kcal,0)} kcal · P ${fmt(v.p)}g · C ${fmt(v.c)}g · G ${fmt(v.f)}g</div>${items.length?items.map(x=>`<div class="historyrow"><div style="min-width:0;flex:1"><b>${esc(x.name)}</b><div class="hint">${fmt(x.grams)} ${esc(x.unit||'g')} · P ${fmt(x.p)}g · C ${fmt(x.c)}g · G ${fmt(x.f)}g</div></div><span style="white-space:nowrap">${fmt(x.kcal,0)} kcal</span></div>`).join(''):'<p class="hint">Nenhum alimento registrado.</p>'}</div>`}).join('')}${weekly()}<div class="sectiontitle">Outros dias com registros</div><div class="card">${dates.length?dates.map(d=>{let x=sum(db.entries.filter(y=>y.date===d));return `<div class="historyrow"><button class="textbtn" data-action="gotodatehistory" data-date="${d}">${label(d)}</button><span>${fmt(x.kcal,0)} kcal</span></div>`}).join(''):'<p class="hint">Ainda não há outros registros.</p>'}</div><p class="hint">As refeições são salvas automaticamente neste navegador. Para não perdê-las ao trocar de aparelho ou limpar os dados, exporte o backup em Configurações.</p>`}

function toolsPage(){return head('Ferramentas 3.2')+`<div class="card"><h2>📷 Foto da comida</h2><p class="hint">Tire uma foto e registre os ingredientes com porções estimadas; sem IA paga ou reconhecimento automático.</p><button class="primary" data-action="photo">Abrir foto assistida</button></div><div class="card"><h2>▥ Código de barras</h2><p class="hint">Pesquise um produto pelo código EAN/UPC. A câmera tenta ler o código onde o navegador permitir; digitar funciona no iPhone.</p><button class="primary" data-action="barcode">Consultar produto</button></div><div class="card"><h2>↗ Copiar refeição</h2><label class="fieldlabel">Data de origem</label><input class="input" id="copydate" type="date" value="${state.date}"><label class="fieldlabel">Refeição de origem</label><select id="copymeal">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select><label class="fieldlabel">Data de destino</label><input class="input" id="copytarget" type="date" value="${today()}"><button class="primary" data-action="copymeal">Copiar alimentos para a data escolhida</button><p class="hint">Cópias recebem novos IDs e são sincronizadas normalmente.</p></div><div class="card"><h2>📈 Evolução corporal</h2><p class="hint">Peso, cintura e gráfico histórico; dados também entram no backup e na sincronização.</p><button class="primary" data-action="progress">Abrir evolução corporal</button></div><div class="card"><h2>🥗 Catálogo ampliado</h2><p class="hint">${FOODS.length+EXTRA_FOODS.length} referências aproximadas e seus alimentos personalizados. Prefira rótulos para produtos específicos.</p><button class="secondary wide" data-action="photosearch">Pesquisar alimentos</button></div>`}
function progressPage(){let a=[...(db.measurements||[])].sort((x,y)=>x.date.localeCompare(y.date)),last=a.at(-1);let min=Math.min(...a.map(x=>x.weight),0),max=Math.max(...a.map(x=>x.weight),1),points=a.map((x,i)=>`${a.length===1?50:i/(a.length-1)*100},${90-(x.weight-min)/(max-min||1)*80}`).join(' ');return head('Evolução corporal')+`<div class="card"><h2>Registrar medidas</h2><label class="fieldlabel">Data</label><input id="measuredate" class="input" type="date" value="${today()}"><div class="formgrid"><div><label class="fieldlabel">Peso (kg)</label><input id="measureweight" class="input" type="number" min="20" max="400" step="0.1" placeholder="77"></div><div><label class="fieldlabel">Cintura (cm, opcional)</label><input id="measurewaist" class="input" type="number" min="0" max="300" step="0.1" placeholder="80"></div></div><button class="primary" data-action="savemeasure">Salvar medidas</button></div><div class="card"><h2>Histórico do peso</h2>${a.length?`<svg viewBox="0 0 100 100" style="width:100%;height:170px;overflow:visible" aria-label="Gráfico de evolução do peso"><polyline fill="none" stroke="#20c56a" stroke-width="2" vector-effect="non-scaling-stroke" points="${points}"/></svg><p class="hint">${a.length} registros · Último peso: ${fmt(last.weight)} kg</p>`:'<p class="hint">Registre seu peso para visualizar o gráfico.</p>'}${a.slice().reverse().map(x=>`<div class="historyrow"><span>${x.date.split('-').reverse().join('/')} · ${fmt(x.weight)} kg ${x.waist?' · Cintura '+fmt(x.waist)+' cm':''}</span><button class="chip" data-action="deletemeasure" data-date="${x.date}" aria-label="Excluir">×</button></div>`).join('')}</div>`}
function barcodePage(){return head('Código de barras')+`<div class="card"><h2>Consultar produto</h2><p class="hint">Informações fornecidas pela comunidade Open Food Facts. Confirme sempre com o rótulo.</p><label class="fieldlabel">EAN / UPC</label><input class="input" id="barcodevalue" inputmode="numeric" placeholder="Digite o código de barras"><button class="primary" data-action="lookupbarcode">Buscar produto</button><label class="fieldlabel">Ou escolha uma foto do código</label><input class="input" type="file" id="barcodephoto" accept="image/*" capture="environment"><div id="barcodestatus" class="hint">A leitura pela câmera depende do navegador. A digitação sempre estará disponível.</div></div>`}
async function lookupBarcode(code){let status=$('barcodestatus');if(!/^\d{8,14}$/.test(code)){alert('Informe um código numérico com 8 a 14 dígitos.');return}if(status)status.textContent='Consultando Open Food Facts…';try{let r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,nutriments,code',{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('Serviço indisponível');let j=await r.json();let n=j.product?.nutriments||{};if(j.status!==1||!j.product){throw Error('Produto não encontrado')}let vals={kcal:Number(n['energy-kcal_100g']),p:Number(n.proteins_100g),c:Number(n.carbohydrates_100g),f:Number(n.fat_100g)};if(Object.values(vals).some(x=>!Number.isFinite(x)||x<0)){throw Error('Dados nutricionais incompletos; confira o rótulo e cadastre manualmente')}let name=[j.product.product_name,j.product.brands].filter(Boolean).join(' — ')||'Produto '+code;let existing=db.custom.find(x=>x.barcode===code);if(!existing){existing={id:'off-'+code,barcode:code,name,unit:'g',...vals,source:'Open Food Facts'};db.custom.unshift(existing);save()}state.selected=existing.id;state.amount=100;show('add')}catch(e){if(status)status.textContent=e.message+'; você pode cadastrar o alimento manualmente.'}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='copymeal'){let src=$('copydate')?.value,meal=$('copymeal')?.value,dest=$('copytarget')?.value;let items=db.entries.filter(x=>x.date===src&&x.meal===meal);if(!items.length){alert('Nenhum alimento encontrado nessa refeição.');return}if(!confirm(`Copiar ${items.length} alimentos de ${src} para ${dest}?`))return;db.entries.push(...items.map(x=>({...x,id:uid(),date:dest})));save();state.date=dest;show('home');alert('Refeição copiada.')}if(a==='savemeasure'){let date=$('measuredate')?.value,weight=Number($('measureweight')?.value),waist=Number($('measurewaist')?.value||0);if(!date||weight<20||weight>400||waist<0||waist>300){alert('Confira data, peso e cintura.');return}db.measurements=(db.measurements||[]).filter(x=>x.date!==date);db.measurements.push({date,weight,waist});save();render()}if(a==='deletemeasure'){if(confirm('Excluir esta medida?')){db.measurements=db.measurements.filter(x=>x.date!==b.dataset.date);save();render()}}if(a==='lookupbarcode')lookupBarcode(($('barcodevalue')?.value||'').trim())});
document.addEventListener('change',async e=>{if(e.target.id!=='barcodephoto')return;let f=e.target.files?.[0];if(!f)return;let el=$('barcodestatus');if(!('BarcodeDetector' in window)){el.textContent='Leitura automática indisponível neste navegador. Digite o código impresso na embalagem.';return}try{let img=await createImageBitmap(f);let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});let codes=await detector.detect(img);img.close();if(codes.length){$('barcodevalue').value=codes[0].rawValue;lookupBarcode(codes[0].rawValue)}else el.textContent='Código não identificado. Digite o número manualmente.'}catch(err){el.textContent='Não foi possível ler a imagem. Digite o código manualmente.'}});

function render(){nav();view().innerHTML=({home,meal,search,add,settings,foodform,macros,history,photo,tools:toolsPage,progress:progressPage,barcode:barcodePage}[state.page]||home)();window.dispatchEvent(new Event('shape:render'));}
function updatePreview(){let f=allFoods().find(x=>x.id===state.selected);let g=Number($('amount')?.value);if(f&&$('foodpreview'))$('foodpreview').textContent=`${fmt(f.kcal*g/100,0)} kcal · P ${fmt(f.p*g/100)}g · C ${fmt(f.c*g/100)}g · G ${fmt(f.f*g/100)}g`}
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;$('foodlist').innerHTML=listFoods()}if(e.target.id==='amount'){state.amount=e.target.value;updatePreview()}if(e.target.id==='day'||e.target.id==='historyday'){state.date=e.target.value||today();render()}});
document.addEventListener('change',async e=>{if(e.target.id==='foodphoto'){let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Selecione uma imagem.');return}if(file.size>12*1024*1024){alert('Imagem muito grande (máximo 12 MB).');return}if(state.photoUrl)URL.revokeObjectURL(state.photoUrl);state.photoUrl=URL.createObjectURL(file);let a=$('photoarea');if(a){a.replaceChildren();let img=document.createElement('img');img.className='photo-frame';img.alt='Foto selecionada';img.src=state.photoUrl;a.append(img)}}if(e.target.id==='importfile'){let file=e.target.files[0];if(!file)return;try{let o=JSON.parse(await file.text());if(!Array.isArray(o.entries)||!Array.isArray(o.custom)||!o.goals)throw Error('Arquivo inválido');if(!confirm('Substituir todos os dados atuais pelos do backup?'))return;db={goals:o.goals,entries:o.entries,custom:o.custom,favorites:o.favorites||[],recent:o.recent||[],measurements:o.measurements||[]};save();show('home');alert('Backup importado.')}catch(err){alert('Não foi possível importar: '+err.message)}}});
document.addEventListener('click',e=>{let navbtn=e.target.closest('[data-page]');if(navbtn){show(navbtn.dataset.page);return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='back'){show(state.page==='search'?'meal':state.page==='add'?'search':'home')}if(a==='history'||a==='settings'||a==='photo'||a==='tools'||a==='progress'||a==='barcode')show(a);if(a==='photosearch'){state.search='';state.filter='popular';show('search')}if(a==='prev'||a==='next'){let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+(a==='prev'?-1:1));state.date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');render()}if(a==='openmeal'){state.meal=b.dataset.meal;show('meal')}if(a==='search'){state.search='';state.filter='popular';show('search')}if(a==='filter'){state.filter=b.dataset.filter;render();$('search')?.focus()}if(a==='selectfood'){state.selected=b.dataset.id;state.amount=100;show('add')}if(a==='amount'){state.amount=Number(b.dataset.amount);$('amount').value=state.amount;updatePreview()}if(a==='saveentry'){let f=allFoods().find(x=>x.id===state.selected);let grams=Number($('amount')?.value);if(!f||!Number.isFinite(grams)||grams<=0||grams>20000){alert('Informe uma quantidade válida.');return}let meal=$('mealSelect').value;db.entries.push({id:uid(),date:state.date,meal,name:f.name,grams,unit:f.unit||'g',kcal:f.kcal*grams/100,p:f.p*grams/100,c:f.c*grams/100,f:f.f*grams/100});db.recent=[f.id,...db.recent.filter(id=>id!==f.id)].slice(0,30);save();state.meal=meal;show('meal')}if(a==='entrymenu'){let x=db.entries.find(x=>x.id===b.dataset.id);if(!x)return;let choice=prompt('Digite 1 para alterar a quantidade, 2 para excluir:', '1');if(choice==='1'){let g=Number(prompt('Nova quantidade ('+(x.unit||'g')+'):',x.grams));if(Number.isFinite(g)&&g>0&&g<=20000){let ratio=g/x.grams;for(let k of ['kcal','p','c','f'])x[k]*=ratio;x.grams=g;save();render()}}else if(choice==='2'&&confirm('Excluir '+x.name+'?')){db.entries=db.entries.filter(y=>y.id!==x.id);save();render()}}if(a==='savegoals'){let o={};for(let k of ['kcal','p','c','f']){o[k]=Number($('goal_'+k).value);if(!Number.isFinite(o[k])||o[k]<0||o[k]>10000){alert('Verifique as metas.');return}}db.goals=o;save();alert('Metas salvas!');render()}if(a==='newfood')show('foodform');if(a==='savefood'){let name=$('fname').value.trim();if(!name){alert('Informe o nome.');return}let o={id:'custom-'+uid(),name,unit:$('funit').value};for(let k of ['kcal','p','c','f']){o[k]=Number($('f_'+k).value);if(!Number.isFinite(o[k])||o[k]<0||o[k]>1000){alert('Valor inválido: '+k);return}}db.custom.unshift(o);save();state.search=name;state.filter='added';show('search')}if(a==='gotodate'){state.date=b.dataset.date;show('home')}if(a==='gotodatehistory'){state.date=b.dataset.date;show('history')}if(a==='today'){state.date=today();render()}if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download='meu-shape-backup-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}if(a==='clear'&&confirm('Apagar todos os registros, metas e alimentos cadastrados?')&&confirm('Confirma? Não será possível desfazer sem backup.')){db={goals:{kcal:2300,p:155,c:262,f:70},entries:[],custom:[],recent:[],favorites:[],measurements:[]};save();show('home')}});
save();render();
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCLE5ScVWtw8f06FOYBDCE7Jh-lRwW64b0',authDomain:'meu-shape-bab6b.firebaseapp.com',projectId:'meu-shape-bab6b',storageBucket:'meu-shape-bab6b.firebasestorage.app',messagingSenderId:'694796836080',appId:'1:694796836080:web:f48f56982a1a0c4cb7b635'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),store=getFirestore(app),provider=new GoogleAuthProvider();
let user=null,ready=false,busy=false,dirty=false,timer=null,status='Faça login para sincronizar entre aparelhos.';
const remoteRef=()=>doc(store,'users',user.uid,'data','diary');
function updateUI(){const el=document.getElementById('cloud-status');if(el)el.textContent=status;const who=document.getElementById('cloud-user');if(who)who.textContent=user?`Conectado: ${user.email||'Conta Google'}`:'';for(const [id,visible] of [['cloud-login',!user],['cloud-sync',!!user],['cloud-logout',!!user]]){let x=document.getElementById(id);if(x)x.style.display=visible?'block':'none'}}
function combine(a,b){let entries=new Map();for(const x of [...(b.entries||[]),...(a.entries||[])])if(x&&x.id)entries.set(String(x.id),x);let custom=new Map();for(const x of [...(b.custom||[]),...(a.custom||[])])if(x&&x.id)custom.set(String(x.id),x);return {goals:a.goals||b.goals||{kcal:2300,p:155,c:262,f:70},entries:[...entries.values()],custom:[...custom.values()],recent:[...new Set([...(a.recent||[]),...(b.recent||[])])].slice(0,30),favorites:[...new Set([...(a.favorites||[]),...(b.favorites||[])])],measurements:[...new Map([...(b.measurements||[]),...(a.measurements||[])].map(x=>[x.date,x])).values()]}}
async function syncFromCloud(){if(!user||busy)return;busy=true;ready=false;status='Consultando registros na nuvem…';updateUI();try{const snap=await getDoc(remoteRef());const cloud=snap.exists()?snap.data():null;const local=db;const hasLocal=(local.entries||[]).length>0||(local.custom||[]).length>0;const hasCloud=cloud&&((cloud.entries||[]).length>0||(cloud.custom||[]).length>0);
if(hasLocal&&(!hasCloud||JSON.stringify(local.entries)!==JSON.stringify(cloud.entries))){const ok=confirm('Deseja unir os registros deste aparelho aos dados da sua conta Google? Seus registros atuais serão preservados. Faça backup antes de continuar.');if(!ok){status='Sincronização não autorizada. Seus dados locais permanecem neste aparelho.';updateUI();return}}
const merged=cloud?combine(local,cloud):local;
db=merged;localStorage.setItem('meushape_v2',JSON.stringify(db));await setDoc(remoteRef(),{...merged,updatedAt:new Date().toISOString()});ready=true;status='✓ Sincronizado com sua conta Google';render();updateUI();
}catch(e){status='Erro ao sincronizar: '+e.message+' — seus dados locais foram mantidos.';updateUI()}finally{busy=false}}
async function upload(){if(!user||!ready||busy)return;busy=true;try{await setDoc(remoteRef(),{...db,updatedAt:new Date().toISOString()});dirty=false;status='✓ Registros salvos na nuvem';}catch(e){status='Falha ao enviar: '+e.message+' — registros salvos neste aparelho.'}finally{busy=false;updateUI();if(dirty&&ready){dirty=false;queueUpload()}}}
function queueUpload(){if(!ready||!user)return;dirty=true;clearTimeout(timer);timer=setTimeout(upload,1400)}
window.addEventListener('shape:changed',queueUpload);window.addEventListener('shape:render',updateUI);
document.addEventListener('click',async e=>{const id=e.target.closest('button')?.id;if(id==='cloud-login'){try{status='Abrindo login Google…';updateUI();await signInWithPopup(auth,provider)}catch(err){if(err.code==='auth/popup-blocked'||err.code==='auth/operation-not-supported-in-this-environment'){try{await signInWithRedirect(auth,provider)}catch(e2){status='Erro no login: '+e2.message;updateUI()}}else{status='Erro no login: '+err.message;updateUI()}}}if(id==='cloud-sync'){await syncFromCloud()}if(id==='cloud-logout'){ready=false;await signOut(auth);status='Desconectado. Os dados locais foram mantidos.';updateUI()}});
getRedirectResult(auth).catch(e=>{status='Erro ao retornar do login: '+e.message;updateUI()});
onAuthStateChanged(auth,async u=>{user=u;if(u){ready=false;await syncFromCloud()}else{ready=false;status='Entre com Google para salvar na nuvem.';updateUI()}});
updateUI();
</script></body></html>
